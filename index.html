<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayNie - วางแผนปลดหนี้ (ส่งให้ AI)</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              paynie: {
                bg: "#0c1a30",
                card: "#152a4a",
                teal: "#2bd9a4",
                tealHover: "#20b689",
                light: "#f8fafc",
                border: "#25406b",
              },
            },
          },
        },
      };
    </script>

    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>

    <style>
      body {
        font-family: "Prompt", sans-serif;
        background-color: #0c1a30;
        color: #f8fafc;
      }
      input[type="range"] {
        -webkit-appearance: none;
        background: transparent;
        width: 100%;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 999px;
        background: #25406b;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 24px;
        width: 24px;
        border-radius: 50%;
        background: #2bd9a4;
        cursor: pointer;
        margin-top: -8px;
        box-shadow: 0 0 10px rgba(43, 217, 164, 0.5);
        border: 2px solid #0c1a30;
      }
    </style>
  </head>
  <body class="pb-24">
    <!-- Header -->
    <div
      class="bg-[#081222] border-b border-paynie-border px-4 py-3 sticky top-0 z-50 flex items-center justify-between shadow-lg"
    >
      <div class="flex items-center gap-2.5">
        <div
          class="w-9 h-9 rounded-xl bg-gradient-to-br from-paynie-teal to-teal-600 flex items-center justify-center text-[#081222] font-extrabold text-lg shadow-md"
        >
          P
        </div>
        <div>
          <h1 class="font-bold text-sm tracking-wide text-paynie-light">
            PayNie Planner
          </h1>
          <p class="text-[10px] text-paynie-teal font-medium">
            ส่งข้อมูลให้ AI วิเคราะห์
          </p>
        </div>
      </div>
    </div>

    <div class="p-4 space-y-5">
      <!-- ฟอร์มเพิ่มหนี้ส่งให้ AI -->
      <section
        class="bg-paynie-card p-4 rounded-2xl shadow-lg border border-paynie-border"
      >
        <h3 class="text-xs font-bold text-white mb-2 flex items-center gap-2">
          <i class="fa-solid fa-plus text-paynie-teal"></i>
          เพิ่มรายการหนี้ใหม่ให้ AI
        </h3>
        <p class="text-[10px] text-slate-400 mb-3">
          กรอกข้อมูลด้านล่าง แล้ว PayNie AI จะอัปเดตพอร์ตหนี้ให้ในแชท
        </p>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <input
            id="inp-name"
            type="text"
            placeholder="ชื่อเจ้าหนี้"
            class="bg-[#0c1a30] text-white p-2.5 border border-paynie-border rounded-lg w-full focus:outline-none focus:border-paynie-teal"
          />
          <input
            id="inp-bal"
            type="number"
            placeholder="ยอดหนี้ (บาท)"
            class="bg-[#0c1a30] text-white p-2.5 border border-paynie-border rounded-lg w-full focus:outline-none focus:border-paynie-teal"
          />
          <input
            id="inp-apr"
            type="number"
            step="0.1"
            placeholder="ดอกเบี้ย %"
            class="bg-[#0c1a30] text-white p-2.5 border border-paynie-border rounded-lg w-full focus:outline-none focus:border-paynie-teal"
          />
        </div>
        <button
          onclick="sendNewDebtToAI()"
          class="mt-3 w-full bg-[#1c3256] hover:bg-[#25406b] text-paynie-light text-xs font-bold py-2.5 rounded-lg transition shadow-sm border border-paynie-border"
        >
          ส่งข้อมูลให้ AI
        </button>
      </section>

      <!-- ปรับงบ & เลือกแผน ส่งให้ AI -->
      <section
        class="bg-paynie-card p-4 rounded-2xl shadow-lg border border-paynie-border"
      >
        <h2
          class="text-sm font-bold text-white flex items-center gap-2 mb-3 border-b border-paynie-border pb-2"
        >
          <i class="fa-solid fa-sliders text-paynie-teal"></i> ปรับงบ & เลือกแผน
        </h2>

        <!-- Slider -->
        <div
          class="mb-4 bg-[#0f1f3a] p-3 rounded-xl border border-paynie-border"
        >
          <div class="flex justify-between items-center text-xs mb-1">
            <span class="text-slate-300 font-medium"
              >งบที่จ่ายไหวต่อเดือน:</span
            >
            <span
              id="budget-label"
              class="font-bold text-paynie-teal text-sm bg-paynie-teal/10 px-2 py-1 rounded-md"
              >฿10,000</span
            >
          </div>
          <input
            id="budget-slider"
            type="range"
            min="3000"
            max="100000"
            step="500"
            value="10000"
            oninput="updateBudgetUI(this.value)"
          />
        </div>

        <!-- เลือกแผน -->
        <div class="grid grid-cols-2 gap-2 mb-4">
          <button
            id="btn-ava"
            onclick="setStrategy('avalanche')"
            class="p-2.5 rounded-xl border-2 border-paynie-teal bg-paynie-teal/10 text-left transition relative overflow-hidden"
          >
            <div class="text-xs font-bold text-paynie-teal mb-1">
              ⚡ Avalanche
            </div>
            <div class="text-[9px] text-slate-300">ประหยัดดอกเบี้ยสูงสุด</div>
          </button>
          <button
            id="btn-snow"
            onclick="setStrategy('snowball')"
            class="p-2.5 rounded-xl border-2 border-paynie-border bg-[#0c1a30] text-left transition opacity-70 hover:opacity-100"
          >
            <div class="text-xs font-bold text-indigo-400 mb-1">
              ❄️ Snowball
            </div>
            <div class="text-[9px] text-slate-400">เน้นปิดยอดเล็กก่อน</div>
          </button>
        </div>

        <p class="text-[10px] text-center text-slate-400 mt-2">
          เมื่อกดยืนยัน AI จะคำนวณตารางจ่ายและดอกเบี้ยที่ประหยัดได้
          ส่งกลับไปในแชท
        </p>
      </section>
    </div>

    <!-- ปุ่มส่งให้ AI (Webhook) -->
    <div
      class="fixed bottom-0 left-0 right-0 p-4 bg-[#081222]/90 backdrop-blur-md border-t border-paynie-border shadow-2xl z-50"
    >
      <button
        onclick="sendPlanToAI()"
        class="w-full py-3.5 rounded-xl bg-paynie-teal hover:bg-paynie-tealHover text-[#081222] font-bold text-sm shadow-[0_0_15px_rgba(43,217,164,0.4)] transition flex items-center justify-center gap-2"
      >
        <i class="fa-solid fa-robot"></i> ส่งให้ AI วิเคราะห์และวางแผน
      </button>
    </div>

    <script>
      const myLiffId = "YOUR_LIFF_ID";
      let budget = 10000;
      let strategy = "avalanche";

      const formatTHB = (num) => "฿" + Math.round(num).toLocaleString("th-TH");

      window.onload = function () {
        // liff.init({ liffId: myLiffId }).then(() => {
        //   if (!liff.isLoggedIn()) liff.login();
        // });
      };

      function updateBudgetUI(val) {
        budget = Number(val);
        document.getElementById("budget-label").textContent = formatTHB(budget);
      }

      function setStrategy(strat) {
        strategy = strat;
        const btnAva = document.getElementById("btn-ava");
        const btnSnow = document.getElementById("btn-snow");

        if (strat === "avalanche") {
          btnAva.className =
            "p-2.5 rounded-xl border-2 border-paynie-teal bg-paynie-teal/10 text-left transition opacity-100";
          btnSnow.className =
            "p-2.5 rounded-xl border-2 border-paynie-border bg-[#0c1a30] text-left transition opacity-70";
        } else {
          btnSnow.className =
            "p-2.5 rounded-xl border-2 border-indigo-400 bg-indigo-500/10 text-left transition opacity-100";
          btnAva.className =
            "p-2.5 rounded-xl border-2 border-paynie-border bg-[#0c1a30] text-left transition opacity-70";
        }
      }

      // ฟังก์ชันส่งให้ AI อัปเดตรายการหนี้
      function sendNewDebtToAI() {
        const name = document.getElementById("inp-name").value;
        const bal = document.getElementById("inp-bal").value;
        const apr = document.getElementById("inp-apr").value;

        if (!name || !bal) return alert("กรุณากรอกชื่อและยอดหนี้");

        // ส่งข้อความเข้าแชทให้ AI อ่าน (Natural Language)
        const textMsg = `เพิ่มรายการหนี้: ${name} ยอด ${bal} บาท ดอกเบี้ย ${apr || "ไม่ระบุ"}%`;

        if (liff.isInClient()) {
          liff
            .sendMessages([{ type: "text", text: textMsg }])
            .then(() => {
              liff.closeWindow();
            })
            .catch((err) => alert("Error: " + err));
        } else {
          alert("จำลองส่งข้อความให้ AI:\n" + textMsg);
        }
      }

      // ฟังก์ชันส่งงบและแผนให้ AI คำนวณตาราง
      function sendPlanToAI() {
        const stratName = strategy === "avalanche" ? "Avalanche" : "Snowball";

        // ส่งคำสั่งที่เป็นภาษาธรรมชาติให้ AI วิเคราะห์
        const textMsg = `ไหวเดือนละ ${budget} บาท ขอเลือกใช้แผน ${stratName} ช่วยคำนวณตารางจ่ายให้หน่อย`;

        if (liff.isInClient()) {
          liff
            .sendMessages([{ type: "text", text: textMsg }])
            .then(() => {
              liff.closeWindow();
            })
            .catch((err) => alert("Error: " + err));
        } else {
          alert("จำลองส่งคำสั่งให้ AI วิเคราะห์:\n" + textMsg);
        }
      }
    </script>
  </body>
</html>
